<style>*{box-sizing:border-box}body{margin:0;background:#f5f1e8;font-family:Arial,'Noto Sans KR',sans-serif;color:#123c32}.wrap{max-width:720px;margin:auto;background:#fff;min-height:100vh}.hero{position:relative}.hero img{display:block;width:100%;height:auto}.hot{position:absolute;left:7%;right:7%;top:39%;height:8%;border:0;background:transparent;cursor:pointer}.screen{display:none;padding:26px 20px 40px}.screen.on{display:block}.top{font-size:13px;color:#9b742d;font-weight:700}.bar{height:7px;background:#eee6d8;border-radius:9px;margin:10px 0 28px;overflow:hidden}.fill{height:100%;background:#0c513f;width:0}h2{font-size:24px;line-height:1.45;margin:0 0 24px}.opt{display:block;width:100%;text-align:left;border:1px solid #e5d8c1;background:#fff;border-radius:15px;padding:17px;margin:10px 0;font-size:16px;cursor:pointer}.opt:hover{border-color:#b68b3d;background:#fbf8f1}.card{border:1px solid #e5d8c1;border-radius:18px;padding:22px;background:#fffaf2;margin:18px 0}.result{font-size:25px;font-weight:900;margin:8px 0;color:#0b513f}input{width:100%;padding:15px;border:1px solid #d8c8ac;border-radius:12px;margin:7px 0;font-size:16px}label{font-size:13px;line-height:1.5;display:block;margin:12px 0}.cta{width:100%;border:0;border-radius:14px;padding:17px;background:#0b513f;color:white;font-size:17px;font-weight:800;cursor:pointer}.sub{font-size:14px;color:#6f6a61;line-height:1.6}</style></head><body><main class="wrap">
<section id="home" class="hero"><img src="/hero-final.jpg?v=20260823-4" alt="자산관리 세미나"><button class="hot" onclick="start()" aria-label="1분 자산관리 체크 시작하기"></button></section>
<section id="quiz" class="screen"><div class="top" id="step"></div><div class="bar"><div class="fill" id="fill"></div></div><h2 id="question"></h2><div id="options"></div></section>
<section id="result" class="screen"><div class="top">1분 자산관리 체크 결과</div><div class="card"><div class="result" id="grade"></div><div id="msg" class="sub"></div><div id="topics" style="margin-top:15px;font-weight:700"></div></div><h2 style="margin-top:30px">세미나 참석을 원하시면<br>간단한 정보만 남겨주세요.</h2><input id="name" placeholder="이름"><input id="phone" inputmode="tel" placeholder="연락처 010-0000-0000"><input id="ref" placeholder="나를 추천한 설계사 이름"><label><input id="agree" type="checkbox" style="width:auto"> 세미나 참석 안내를 위한 개인정보 수집·이용에 동의합니다. 수집항목: 이름, 연락처, 추천 설계사, 설문결과 / 목적: 세미나 참석 확인 및 안내</label><button class="cta" onclick="submitForm()">세미나 참석 신청하기</button><p id="status" class="sub"></p></section>
</main><script>
const qs=[["요즘 세금이 예전보다 많이 나간다고 느끼시나요?",["네, 줄일 방법이 궁금해요","조금 관심 있어요","아직 잘 모르겠어요"]],["현재 금융자산의 수익률이 만족스럽지 않으신가요?",["네, 더 나은 방법을 찾고 있어요","보통이에요","현재 만족해요"]],["예·적금 외에 자산을 나눠서 관리하고 계신가요?",["여러 자산으로 분산하고 있어요","일부만 하고 있어요","대부분 예·적금이에요"]],["달러자산이나 해외자산을 보유하고 계시거나 관심이 있으신가요?",["이미 보유하고 있어요","관심은 있지만 아직 없어요","별로 관심 없어요"]],["상속·증여를 미리 준비해야겠다고 생각해보신 적이 있나요?",["구체적으로 준비 중이에요","관심은 있어요","아직 생각해보지 않았어요"]],["노후 연금이 현재 생활수준을 유지하기에 충분할지 궁금하신가요?",["많이 궁금해요","한번 점검해보고 싶어요","현재는 괜찮다고 생각해요"]],["전문가에게 내 자산의 절세·수익·연금 구조를 한 번에 점검받아보고 싶으신가요?",["네, 필요해요","세미나에서 먼저 들어보고 싶어요","아직은 정보만 보고 싶어요"]]];let idx=0,ans=[];const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('main > section').forEach(el=>{el.classList.remove('on');el.style.display='none'});const target=$(id);target.style.display='block';if(id!=='home')target.classList.add('on');window.scrollTo({top:0,behavior:'smooth'})}function start(){idx=0;ans=[];show('quiz');render()}function render(){const q=qs[idx];$('step').textContent=`${idx+1} / ${qs.length}`;$('fill').style.width=`${((idx+1)/qs.length)*100}%`;$('question').textContent=q[0];$('options').innerHTML='';q[1].forEach((text,i)=>{const btn=document.createElement('button');btn.type='button';btn.className='opt';btn.textContent=text;btn.addEventListener('click',()=>pick(i));$('options').appendChild(btn)})}function pick(i){ans.push(i);idx+=1;if(idx<qs.length)render();else finish()}function finish(){show('result');const interest=ans.filter(v=>v===0).length;const labels=[];if(ans[0]<2)labels.push('절세');if(ans[1]<2||ans[2]>0)labels.push('자산배분·수익률');if(ans[3]<2)labels.push('달러·해외자산');if(ans[4]<2)labels.push('상속·증여');if(ans[5]<2)labels.push('연금·노후');$('topics').textContent='관심 주제: '+(labels.length?labels.join(' · '):'경제·자산관리 전반');if(interest>=4){$('grade').textContent='🟢 세미나 참석 추천';$('msg').textContent='현재 고민하시는 내용이 이번 세미나 주제와 잘 맞습니다.'}else if(interest>=2){$('grade').textContent='🟡 관심 주제 있음';$('msg').textContent='절세·연금·자산배분 중 일부 주제가 도움될 수 있습니다.'}else{$('grade').textContent='⚪ 정보형 참석 추천';$('msg').textContent='당장 필요하지 않더라도 경제·세금·연금 흐름을 한 번에 정리하기 좋은 자리입니다.'}}function validPhone(v){return /^01[016789]-?\d{3,4}-?\d{4}$/.test(v.replace(/\s/g,''))}async function submitForm(){const name=$('name').value.trim(),phone=$('phone').value.trim(),referrer=$('ref').value.trim();if(!name||!phone||!referrer){alert('이름, 연락처, 추천 설계사 이름을 입력해주세요.');return}if(!validPhone(phone)){alert('연락처를 정확히 입력해주세요.');return}if(!$('agree').checked){alert('개인정보 수집·이용 동의가 필요합니다.');return}const btn=document.querySelector('.cta');btn.disabled=true;$('status').textContent='신청 내용을 전송하고 있습니다...';try{const r=await fetch('/api/seminar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone,referrer,answers:ans,result:$('grade').textContent,topics:$('topics').textContent})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok)throw new Error(data.error||('HTTP '+r.status));$('status').textContent='신청이 완료되었습니다. 담당자가 확인 후 안내드리겠습니다.';btn.textContent='신청 완료'}catch(e){$('status').textContent='신청 오류: '+(e.message||'전송 실패');btn.disabled=false}}document.addEventListener('DOMContentLoaded',()=>{show('home');document.querySelector('.hot').addEventListener('click',start)});
</script></body></html>
