<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b36"><title>구리리더스HB 관리자 센터</title><style>:root{--bg:#071426;--card:#0e223d;--line:#294563;--txt:#eff6ff;--muted:#91a5bd;--blue:#3186f6;--green:#1fc18a;--amber:#f2b84b;--red:#e55f69}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#153d6c 0,#071426 34%,#050d18 100%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.head{display:flex;align-items:center;gap:15px;padding:16px 0}.logo{width:66px;height:66px;border-radius:19px;background:linear-gradient(135deg,#254f7d,#0a1d34);border:1px solid #406990;display:grid;place-items:center;font-weight:900;font-size:24px}.head small{color:#79aee8;letter-spacing:.16em}.head h1{margin:2px 0 0}.panel{background:linear-gradient(180deg,#102743e8,#0b1d33e8);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 18px 50px #0004}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0a1b30;border:1px solid #243d58;border-radius:17px;padding:15px}.stat b{font-size:26px}.stat span{display:block;font-size:12px;color:var(--muted);margin-top:4px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select{background:#08192b;color:#fff;border:1px solid #2b4664;border-radius:12px;padding:11px 12px}.btn{border:0;border-radius:11px;padding:10px 12px;font-weight:800;cursor:pointer}.approve{background:var(--green);color:#03291d}.suspend{background:var(--amber);color:#3d2a00}.reject{background:#40202a;color:#ffb9c0}.ghost{background:#17314e;color:#d8e8fa}.table{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:12px 10px;border-bottom:1px solid #213a55;text-align:left;font-size:14px}th{color:#89a5c3;font-size:12px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.pending{background:#4a3913;color:#ffd978}.approved{background:#123d32;color:#70e6b8}.suspended{background:#452027;color:#ff9eaa}.admins{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#102f52;border:1px solid #28517e;border-radius:999px;padding:8px 11px;font-size:13px}.note{color:var(--muted);font-size:13px;line-height:1.55}.gate{max-width:450px;margin:10vh auto;background:#0d223d;border:1px solid #2a4b6f;border-radius:24px;padding:24px}.gate input{width:100%;margin-top:10px;background:#071629;color:white;border:1px solid #345575;border-radius:13px;padding:14px;font-size:16px}.hidden{display:none!important}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.head h1{font-size:22px}}</style></head><body><div class="gate" id="gate"><div class="head"><div class="logo">HB</div><div><small>ADMIN ONLY</small><h1>관리자 센터</h1></div></div><p class="note">관리자 전용 PIN을 입력하세요.</p><input id="pw" type="password" placeholder="관리자 PIN"><button class="btn approve" style="width:100%;margin-top:10px" onclick="unlock()">관리자 로그인</button><div id="gmsg" class="note" style="margin-top:10px"></div></div><main class="wrap hidden" id="dashboard"><div class="head"><div class="logo">HB</div><div><small>GURI LEADERS HB · ADMIN</small><h1>유료DB 관리자 커맨드 센터</h1></div></div><div class="stats"><div class="stat"><b id="total">0</b><span>전체 회원</span></div><div class="stat"><b id="pendingN">0</b><span>승인 대기</span></div><div class="stat"><b id="approvedN">0</b><span>사용 승인</span></div><div class="stat"><b id="suspendedN">0</b><span>사용 정지</span></div></div><section class="panel"><div class="toolbar"><input id="q" placeholder="이름/소속 검색" oninput="render()"><select id="filter" onchange="render()"><option value="all">전체 상태</option><option value="pending">승인 대기</option><option value="approved">승인</option><option value="suspended">정지</option></select><button class="btn ghost" onclick="loadMembers()">새로고침</button></div><div class="table"><table><thead><tr><th>이름</th><th>소속/직책</th><th>상태</th><th>가입일</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel"><h3 style="margin-top:0">기본 관리자</h3><div class="admins"><span class="chip">이미라 단장</span><span class="chip">이중재 EM</span><span class="chip">차지혜 실장</span><span class="chip">송은희 코치</span></div></section><section class="panel"><h3 style="margin-top:0">운영 제어</h3><div class="toolbar"><button class="btn suspend" onclick="bulk('suspended')">전체 일시정지</button><button class="btn approve" onclick="bulk('approved')">전체 재활성화</button></div><p class="note">Supabase 공용 DB 연결 후 여러 기기에서 회원가입·승인·정지 상태를 공유합니다.</p></section></main><script>window.APP_CONFIG={supabaseUrl:'',supabaseAnonKey:''};const cfg=window.APP_CONFIG,base=(cfg.supabaseUrl||'').replace(/\/$/,''),key=cfg.supabaseAnonKey||'';const SB={ready:()=>!!(base&&key),rpc:async(fn,body={})=>{if(!(base&&key))throw new Error('Supabase 연결 정보가 없습니다.');const r=await fetch(`${base}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:key,Authorization:`Bearer ${key}`,'Content-Type':'application/json'},body:JSON.stringify(body)});let d;try{d=await r.json()}catch{d=await r.text()}if(!r.ok)throw new Error((d&&d.message)||d||`HTTP ${r.status}`);return d}};let PIN='',members=[];const $=id=>document.getElementById(id);async function unlock(){PIN=$('pw').value.trim();if(!PIN)return $('gmsg').textContent='PIN을 입력해 주세요.';try{const ok=await SB.rpc('admin_check',{p_pin:PIN});if(!ok)return $('gmsg').textContent='관리자 인증에 실패했습니다.';$('gate').classList.add('hidden');$('dashboard').classList.remove('hidden');await loadMembers()}catch(e){$('gmsg').textContent=e.message}}async function loadMembers(){try{members=await SB.rpc('admin_list_members',{p_pin:PIN})||[];render()}catch(e){alert(e.message)}}function render(){const q=($('q').value||'').trim().toLowerCase(),f=$('filter').value;const list=members.filter(m=>(f==='all'||m.status===f)&&(!q||`${m.name} ${m.team} ${m.role}`.toLowerCase().includes(q)));$('total').textContent=members.length;$('pendingN').textContent=members.filter(m=>m.status==='pending').length;$('approvedN').textContent=members.filter(m=>m.status==='approved').length;$('suspendedN').textContent=members.filter(m=>m.status==='suspended').length;$('rows').innerHTML=list.map(m=>`<tr><td><b>${m.name}</b></td><td>${m.team}<br><span class="note">${m.role}</span></td><td><span class="badge ${m.status}">${m.status==='pending'?'승인대기':m.status==='approved'?'승인':'정지'}</span></td><td>${new Date(m.created_at).toLocaleDateString('ko-KR')}</td><td><button class="btn approve" onclick="setStatus('${m.id}','approved')">승인</button> <button class="btn suspend" onclick="setStatus('${m.id}','suspended')">정지</button> <button class="btn reject" onclick="delMember('${m.id}')">삭제</button></td></tr>`).join('')||'<tr><td colspan="5" class="note">등록된 회원이 없습니다.</td></tr>'}async function setStatus(id,status){await SB.rpc('admin_set_member_status',{p_pin:PIN,p_id:id,p_status:status});await loadMembers()}async function delMember(id){if(!confirm('이 회원을 삭제할까요?'))return;await SB.rpc('admin_delete_member',{p_pin:PIN,p_id:id});await loadMembers()}async function bulk(status){if(!confirm('전체 회원 상태를 변경할까요?'))return;await SB.rpc('admin_bulk_status',{p_pin:PIN,p_status:status});await loadMembers()}if(!SB.ready())$('gmsg').textContent='화면 배포는 완료됐고 Supabase 연결 정보만 입력하면 즉시 활성화됩니다.';</script></body></html>
