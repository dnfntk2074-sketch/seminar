<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1677ff"><title>금융계산기 PRO | 구리리더스HB</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(180deg,#eaf5ff,#f7fbff 42%,#eef5ff);color:#102447}.app{max-width:760px;margin:auto;padding:18px 14px 42px}.back{display:inline-flex;text-decoration:none;color:#2563eb;font-size:13px;font-weight:850;margin:0 0 14px}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,#0d62e8,#55b8ff);color:#fff;font-weight:900;font-size:22px;display:grid;place-items:center;box-shadow:0 10px 26px rgba(22,119,255,.22)}.small{font-size:12px;color:#3878c8;font-weight:800;letter-spacing:.09em}.title{font-size:22px;font-weight:900;letter-spacing:-.04em;margin-top:2px}.hero{background:rgba(255,255,255,.93);border:1px solid #d7e8fa;border-radius:28px;padding:24px 20px;box-shadow:0 12px 32px rgba(44,91,150,.07);margin-bottom:14px}.hero h1{font-size:31px;line-height:1.08;margin:0 0 10px;letter-spacing:-.06em}.hero p{margin:0;color:#6e819d;line-height:1.6;font-size:15px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.tab{border:1px solid #d5e5f7;background:#fff;color:#315274;border-radius:14px;min-height:46px;font-weight:800;font-size:13px;padding:8px}.tab.active{background:#1677ff;color:#fff;border-color:#1677ff}.card{background:#fff;border:1px solid #d8e7f6;border-radius:24px;padding:18px;box-shadow:0 8px 24px rgba(61,103,160,.05);margin-bottom:14px}.section-title{font-size:19px;font-weight:900;margin-bottom:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:800;color:#526987;margin-bottom:6px}.field input{width:100%;min-height:46px;border:1px solid #cfe0f1;border-radius:14px;padding:0 12px;background:#fbfdff;font-size:16px;color:#102447}.btn{width:100%;min-height:50px;border:0;border-radius:15px;background:#1677ff;color:#fff;font-size:16px;font-weight:900}.result{background:linear-gradient(135deg,#0d63ea,#268ef6);color:#fff;border-radius:22px;padding:20px;margin-top:14px}.result .label{font-size:13px;opacity:.82}.result .big{font-size:30px;font-weight:950;margin:5px 0 12px;letter-spacing:-.05em}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:rgba(255,255,255,.13);border-radius:14px;padding:12px}.stat span{display:block;font-size:11px;opacity:.8}.stat strong{display:block;margin-top:4px;font-size:15px}.scenario{display:grid;gap:10px;margin-top:10px}.scenario .row{border:1px solid #d7e7f6;border-radius:15px;padding:13px;background:#fbfdff;display:flex;justify-content:space-between;gap:10px}.scenario .row strong{font-size:14px;color:#1267d7}.note{font-size:11px;line-height:1.55;color:#7b8ba2;margin-top:12px}.hidden{display:none}.footer{text-align:center;color:#7d91ac;font-size:11px;padding:6px 0}@media(max-width:460px){.tabs{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:28px}}</style></head><body><div class="app"><a class="back" href="/">← TOOLBOX로 돌아가기</a><div class="top"><div class="logo">HB</div><div><div class="small">LEADERS HB FINANCE TOOL</div><div class="title">금융계산기 PRO</div></div></div><section class="hero"><h1>숫자로 바로 보여주는<br>금융 상담 계산기</h1><p>목돈·적립식·목표자금·대출·일반연금·변액연금을 한 앱에서 계산합니다.</p></section><div class="tabs"><button class="tab active" data-tab="compound">목돈·복리</button><button class="tab" data-tab="savings">적립식</button><button class="tab" data-tab="goal">목표자금</button><button class="tab" data-tab="loan">대출</button><button class="tab" data-tab="pension">일반연금</button><button class="tab" data-tab="variable">변액연금</button></div><section class="card panel" id="compound"><div class="section-title">목돈 · 복리 계산</div><div class="field"><label>초기금액</label><input id="cPrincipal" type="number" value="10000000"></div><div class="grid2"><div class="field"><label>연 수익률 (%)</label><input id="cRate" type="number" step=".1" value="5"></div><div class="field"><label>기간 (년)</label><input id="cYears" type="number" value="10"></div></div><button class="btn" data-calc="compound">계산하기</button><div id="cResult"></div></section><section class="card panel hidden" id="savings"><div class="section-title">적립식 계산</div><div class="field"><label>월 적립액</label><input id="sMonthly" type="number" value="300000"></div><div class="grid2"><div class="field"><label>연 수익률 (%)</label><input id="sRate" type="number" step=".1" value="5"></div><div class="field"><label>기간 (년)</label><input id="sYears" type="number" value="10"></div></div><button class="btn" data-calc="savings">계산하기</button><div id="sResult"></div></section><section class="card panel hidden" id="goal"><div class="section-title">목표자금 계산</div><div class="field"><label>목표금액</label><input id="gTarget" type="number" value="100000000"></div><div class="grid2"><div class="field"><label>연 수익률 (%)</label><input id="gRate" type="number" step=".1" value="5"></div><div class="field"><label>목표기간 (년)</label><input id="gYears" type="number" value="10"></div></div><button class="btn" data-calc="goal">계산하기</button><div id="gResult"></div></section><section class="card panel hidden" id="loan"><div class="section-title">대출 상환 계산</div><div class="field"><label>대출금액</label><input id="lAmount" type="number" value="300000000"></div><div class="grid2"><div class="field"><label>연 금리 (%)</label><input id="lRate" type="number" step=".1" value="4"></div><div class="field"><label>상환기간 (년)</label><input id="lYears" type="number" value="30"></div></div><button class="btn" data-calc="loan">계산하기</button><div id="lResult"></div></section><section class="card panel hidden" id="pension"><div class="section-title">일반연금 계산</div><div class="field"><label>월 납입액</label><input id="pMonthly" type="number" value="500000"></div><div class="grid2"><div class="field"><label>납입기간 (년)</label><input id="pPayYears" type="number" value="10"></div><div class="field"><label>거치기간 (년)</label><input id="pWaitYears" type="number" value="10"></div></div><div class="grid2"><div class="field"><label>적립이율 (%)</label><input id="pRate" type="number" step=".1" value="3"></div><div class="field"><label>연금기간 (년)</label><input id="pReceive" type="number" value="20"></div></div><div class="field"><label>연금 수령기간 운용수익률 (%)</label><input id="pPayout" type="number" step=".1" value="2"></div><button class="btn" data-calc="pension">계산하기</button><div id="pResult"></div></section><section class="card panel hidden" id="variable"><div class="section-title">변액연금 시나리오</div><div class="field"><label>월 납입액</label><input id="vMonthly" type="number" value="500000"></div><div class="grid2"><div class="field"><label>납입기간 (년)</label><input id="vPayYears" type="number" value="10"></div><div class="field"><label>거치기간 (년)</label><input id="vWaitYears" type="number" value="10"></div></div><div class="grid2"><div class="field"><label>사업비·제비용 가정 (%)</label><input id="vFee" type="number" step=".1" value="7"></div><div class="field"><label>연금기간 (년)</label><input id="vReceive" type="number" value="20"></div></div><div class="field"><label>연금 수령기간 운용수익률 (%)</label><input id="vPayout" type="number" step=".1" value="2"></div><button class="btn" data-calc="variable">3% · 5% · 7% 비교</button><div id="vResult"></div><div class="note">※ 변액연금은 펀드 운용성과에 따라 적립금과 연금액이 달라질 수 있으며, 본 계산은 단순 시뮬레이션입니다.</div></section><div class="footer">A+에셋 · 구리리더스HB사업단</div></div><script>const money=n=>Math.max(0,Math.round(Number.isFinite(n)?n:0)).toLocaleString('ko-KR')+'원';const num=id=>{const v=parseFloat(document.getElementById(id).value);return Number.isFinite(v)?v:0};const result=(main,aLabel,a,bLabel,b)=>`<div class="result"><div class="label">예상 결과</div><div class="big">${money(main)}</div><div class="stats"><div class="stat"><span>${aLabel}</span><strong>${money(a)}</strong></div><div class="stat"><span>${bLabel}</span><strong>${money(b)}</strong></div></div></div>`;const annuityFV=(p,r,n)=>{r=r/100/12;return r===0?p*n:p*((Math.pow(1+r,n)-1)/r)};const grow=(a,r,y)=>a*Math.pow(1+r/100,y);const annuityPMT=(pv,r,n)=>{r=r/100/12;return r===0?pv/n:pv*r/(1-Math.pow(1+r,-n))};document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden')}));document.querySelectorAll('[data-calc]').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.calc;if(t==='compound'){const p=num('cPrincipal'),r=num('cRate'),y=num('cYears'),fv=p*Math.pow(1+r/100,y);cResult.innerHTML=result(fv,'원금',p,'예상 수익',fv-p)}if(t==='savings'){const m=num('sMonthly'),r=num('sRate'),n=num('sYears')*12,fv=annuityFV(m,r,n),paid=m*n;sResult.innerHTML=result(fv,'총 납입액',paid,'예상 수익',fv-paid)}if(t==='goal'){const target=num('gTarget'),r=num('gRate')/100/12,n=num('gYears')*12;const m=r===0?target/n:target*r/(Math.pow(1+r,n)-1);gResult.innerHTML=result(m,'목표금액',target,'연간 필요 적립액',m*12)}if(t==='loan'){const a=num('lAmount'),r=num('lRate')/100/12,n=num('lYears')*12;const m=r===0?a/n:a*r/(1-Math.pow(1+r,-n)),total=m*n;lResult.innerHTML=result(m,'총 상환액',total,'총 이자',total-a)}if(t==='pension'){const m=num('pMonthly'),py=num('pPayYears'),wy=num('pWaitYears'),r=num('pRate'),ry=num('pReceive'),pr=num('pPayout');const paid=m*py*12,fund=grow(annuityFV(m,r,py*12),r,wy),monthly=annuityPMT(fund,pr,ry*12);pResult.innerHTML=result(monthly,'연금개시 적립금',fund,'총 납입액',paid)}if(t==='variable'){const m=num('vMonthly'),py=num('vPayYears'),wy=num('vWaitYears'),fee=Math.min(30,Math.max(0,num('vFee')))/100,ry=num('vReceive'),pr=num('vPayout');let h='<div class="scenario">';[3,5,7].forEach(rate=>{const fund=grow(annuityFV(m*(1-fee),rate,py*12),rate,wy);const monthly=annuityPMT(fund,pr,ry*12);h+=`<div class="row"><b>${rate}% 시나리오</b><span><strong>${money(fund)}</strong><br><small>월연금 ${money(monthly)}</small></span></div>`});h+='</div>';vResult.innerHTML=h}}));document.querySelector('[data-calc="compound"]').click();</script></body></html>
