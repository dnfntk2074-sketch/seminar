<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>구리리더스HB 유료DB ACTION HUB</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#162033}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px #0000000a}.brand-logo{display:block;width:auto;max-width:min(100%,360px);height:auto;max-height:88px;object-fit:contain;margin:0 auto 8px 0}.title{font-size:22px;font-weight:900;margin-top:8px}.sub{font-size:13px;color:#6b7280;margin-top:4px}.led{position:relative;overflow:hidden;background:#13233f;color:#7dd3fc;border-radius:18px;padding:20px 14px;margin-bottom:10px;min-height:68px;display:flex;align-items:center;font-size:18px;font-weight:900;text-shadow:0 0 7px currentColor}.led .scroll{white-space:nowrap;animation:marq 16s linear infinite;padding-left:100%}@keyframes marq{to{transform:translateX(-100%)}}.mvp{background:#20194a;color:#ffd166}.mvp b{margin-right:10px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#eef2f7;padding:5px;border-radius:12px}.tabs button{border:0;border-radius:9px;padding:12px 4px;background:transparent;font-weight:800}.tabs button.on{background:white;box-shadow:0 1px 6px #0001}.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:800;color:#6b7280;margin-bottom:5px}.input{display:block;width:100%;max-width:100%;min-width:0;height:46px;border:1px solid #dbe1ea;border-radius:12px;padding:0 12px;font-size:15px;background:white}.dt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}.dt>.field{min-width:0}.dt input[type=date],.dt input[type=time]{display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;-webkit-appearance:none;appearance:none}.submit{width:100%;height:48px;border:0;border-radius:12px;background:#2456d8;color:#fff;font-weight:900;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.day{border:1px solid #e5eaf1;background:#f8fafc;border-radius:12px;padding:10px;min-width:0}.day h4{margin:0 0 7px;font-size:14px}.item{background:white;border-radius:8px;padding:8px;margin-top:6px;font-size:12px}.item-actions{display:flex;gap:6px;margin-top:7px}.item-actions button{border:0;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:800}.edit-btn{background:#e8efff;color:#2456d8}.delete-btn{background:#ffe9ea;color:#b4232d}.muted{color:#9ca3af;font-size:12px}.editbox{border:1px solid #dbe1ea;border-radius:14px;padding:12px;margin-top:10px;background:#f8fafc}.edit-actions{display:flex;gap:8px;margin-top:10px}.edit-actions button{flex:1;height:42px;border:0;border-radius:10px;font-weight:900}.save-btn{background:#2456d8;color:#fff}.cancel-btn{background:#e9edf3;color:#334155}@media(max-width:420px){.wrap{padding:10px}.card{padding:14px}.brand-logo{max-width:100%;max-height:72px}.title{font-size:20px}.led{font-size:16px;padding:17px 12px}.grid{gap:6px}.day{padding:8px}.item{font-size:11px}.tabs button{font-size:12px;padding:11px 2px}}@media(max-width:340px){.dt{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="card"><img class="brand-logo" src="/brand-logo.jpeg" alt="보험이 착해지다 A+에셋"><div class="title" id="appTitle">유료DB ACTION HUB</div><div class="sub" id="appSub">방문 · 학습 · 콜 활동을 한눈에 공유합니다.</div></div>
<div class="led"><div class="scroll" id="marquee">일정을 불러오는 중...</div></div>
<div class="led mvp"><b id="mvpTitle">한주 최다 방문 MVP</b><span id="mvpText">집계 중...</span></div>
<div class="card"><b>ACTION 등록</b><div class="tabs" id="tabs"><button class="on" data-t="visit">🤝 방문일정</button><button data-t="study">📚 DB학습회</button><button data-t="call">⚡ 콜번개</button></div>
<div class="field"><label>TFA</label><input class="input" id="owner" placeholder="예: 이충학"></div>
<div class="field"><label id="placeLabel">방문 장소</label><input class="input" id="place" placeholder="예: 구리OO병원"></div>
<div class="dt"><div class="field"><label>날짜</label><input class="input" type="date" id="date"></div><div class="field"><label>시간</label><input class="input" type="time" step="300" id="time"></div></div>
<button class="submit" id="submit">방문일정 등록</button><div class="muted" id="msg"></div></div>
<div class="card"><b>2주 ACTION 스케줄러</b><div class="grid" id="grid" style="margin-top:10px"></div></div>
<div class="card editbox" id="editBox" hidden><b>내 일정 수정</b><div class="field"><label>일정 종류</label><select class="input" id="editType"><option value="visit">🤝 방문일정</option><option value="study">📚 DB학습회</option><option value="call">⚡ 콜번개</option></select></div><div class="field"><label>TFA 이름</label><input class="input" id="editOwner"></div><div class="field"><label>장소/주제</label><input class="input" id="editPlace"></div><div class="dt"><div class="field"><label>날짜</label><input class="input" type="date" id="editDate"></div><div class="field"><label>시간</label><input class="input" type="time" step="300" id="editTime"></div></div><div class="edit-actions"><button class="cancel-btn" id="cancelEdit">취소</button><button class="save-btn" id="saveEdit">수정 저장</button></div></div>
</div><script>
let tab="visit", data=[], editingId="";
const OWNER_KEY="hb_action_owner_token_v1";
let ownerToken=localStorage.getItem(OWNER_KEY);if(!ownerToken){ownerToken=crypto.randomUUID();localStorage.setItem(OWNER_KEY,ownerToken)}
const meta={visit:["방문 장소","예: 구리OO병원","방문일정 등록"],study:["학습회 장소/주제","예: 11층 교육장 · 자동차보험","DB학습회 등록"],call:["콜번개 장소/메모","예: 11층 · 집중콜","콜번개 등록"]};
tabs.onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;[...tabs.children].forEach(b=>b.classList.toggle("on",b.dataset.t===tab));placeLabel.textContent=meta[tab][0];place.placeholder=meta[tab][1];submit.textContent=meta[tab][2]}};
function seoulDate(d=new Date()){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(d)}
function add(iso,n){let d=new Date(iso+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function parse(s){let d=new Date(s.scheduledAt),name=s.customerName||"",type="visit",p=name;if(name.startsWith("[DB학습회] ")){type="study";p=name.slice(9)}else if(name.startsWith("[콜번개] ")){type="call";p=name.slice(7)}return{id:String(s.id),owner:s.ownerName||"",place:p,type,date:seoulDate(d),time:new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Seoul",hour:"2-digit",minute:"2-digit",hour12:false}).format(d),at:d.getTime(),canEdit:!!s.canEdit}}
function week(){let t=seoulDate(),d=new Date(t+"T00:00:00Z"),dow=d.getUTCDay(),back=dow===0?6:dow-1;let m=add(t,-back);return[m,add(m,6)]}
async function load(){let r=await fetch("/api/data",{headers:{"x-owner-token":ownerToken}}),j=await r.json();let s=j.settings||{};appTitle.textContent=s.app_title||"유료DB ACTION HUB";appSub.textContent=s.app_subtitle||"";mvpTitle.textContent=s.mvp_title||"한주 최다 방문 MVP";document.querySelector(".mvp").style.display=s.mvp_enabled===false?"none":"flex";data=(j.schedules||[]).map(parse).sort((a,b)=>a.at-b.at);let n=data.find(x=>x.type==="visit"&&x.at>=Date.now());marquee.textContent=s.marquee_mode==="manual"&&s.marquee_text?s.marquee_text:(n?`다음 방문 일정 · ${n.date} ${n.time} · ${n.owner} TFA · ${n.place}`:"등록된 다음 방문 일정이 없습니다");let [m,su]=week(),c={};data.filter(x=>x.type==="visit"&&x.date>=m&&x.date<=su).forEach(x=>c[x.owner]=(c[x.owner]||0)+1);let vals=Object.entries(c);if(!vals.length)mvpText.textContent="이번 주 방문 기록 없음";else{let mx=Math.max(...vals.map(x=>x[1]));mvpText.textContent=vals.filter(x=>x[1]===mx).map(x=>x[0]).join(" · ")+" TFA · "+mx+"건"}render()}
function render(){let t=seoulDate();grid.innerHTML="";for(let i=0;i<14;i++){let d=add(t,i),list=data.filter(x=>x.date===d),el=document.createElement("div");el.className="day";el.innerHTML=`<h4>${d.slice(5,7)}월 ${d.slice(8)}일</h4>`+(list.length?list.map(x=>`<div class=item data-id="${x.id}">${x.type==="visit"?"🤝":x.type==="study"?"📚":"⚡"} <b>${x.time} · ${esc(x.owner)}</b><br>${esc(x.place)}${x.canEdit?`<div class=item-actions><button class=edit-btn data-edit="${x.id}">수정</button><button class=delete-btn data-delete="${x.id}">삭제</button></div>`:""}</div>`).join(""):"<div class=muted>등록 일정 없음</div>");grid.appendChild(el)}}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
grid.onclick=async e=>{let id=e.target.dataset.edit||e.target.dataset.delete;if(!id)return;let x=data.find(v=>v.id===id);if(!x||!x.canEdit)return;if(e.target.dataset.delete){if(!confirm("정말 삭제할까요?"))return;let r=await fetch("/api/schedules/"+encodeURIComponent(id),{method:"DELETE",headers:{"x-owner-token":ownerToken}});if(r.ok){if(editingId===id)closeEdit();await load()}else alert("삭제하지 못했습니다.");return}openEdit(x)};
function openEdit(x){editingId=x.id;editType.value=x.type;editOwner.value=x.owner;editPlace.value=x.place;editDate.value=x.date;editTime.value=x.time;editBox.hidden=false;editBox.scrollIntoView({behavior:"smooth",block:"center"})}
function closeEdit(){editingId="";editBox.hidden=true}
cancelEdit.onclick=closeEdit;
saveEdit.onclick=async()=>{if(!editingId)return;let body={type:editType.value,ownerName:editOwner.value.trim(),place:editPlace.value.trim(),date:editDate.value,time:editTime.value,ownerToken};if(!body.ownerName||!body.place||!body.date||!body.time){alert("모든 항목을 입력해 주세요.");return}let r=await fetch("/api/schedules/"+encodeURIComponent(editingId),{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(body)});if(r.ok){closeEdit();await load()}else alert("수정하지 못했습니다.")};
submit.onclick=async()=>{msg.textContent="";if(!owner.value||!place.value||!date.value||!time.value){msg.textContent="모든 항목을 입력해 주세요.";return}let r=await fetch("/api/register",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({ownerName:owner.value.trim(),place:place.value.trim(),date:date.value,time:time.value,type:tab,ownerToken})});msg.textContent=r.ok?"등록되었습니다!":"등록에 실패했습니다.";if(r.ok){place.value="";date.value="";time.value="";await load()}}
let today=seoulDate();date.min=today;date.max=add(today,13);editDate.min=today;editDate.max=add(today,13);load();
</script></body></html>
