<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>이용 승인 신청 | 구리리더스HB</title><link rel="stylesheet" href="/approvals/style.css"></head><body><main style="max-width:500px"><header><div class="brand"><span class="brand-icon">HB</span><h1>이용 승인 신청</h1></div></header><section class="card"><span class="eyebrow">MEMBER ACCESS</span><h2 id="label">이용 권한 확인 중</h2><p id="message" role="status">잠시만 기다려 주세요.</p><form id="requestForm" hidden><label>사번<input name="employee" required maxlength="30" autocomplete="off" placeholder="사번을 입력해 주세요"></label><label>이름<input name="name" required minlength="2" maxlength="40" autocomplete="name" placeholder="성함을 입력해 주세요"></label><label>휴대폰번호<input name="phone" type="tel" required autocomplete="tel" placeholder="010-0000-0000"></label><label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" name="consent" required style="width:20px;margin:4px 0"><span>이용 승인 및 권한 관리를 위한 사번·이름·휴대폰번호 수집·이용에 동의합니다. 신청 대기는 90일, 승인 후에는 이용 기간 동안 보관하며 거절·이용 중지 후 30일 이내 파기합니다. 복구용 백업본은 추가 30일 이내 파기합니다. 동의하지 않으면 신청하실 수 없습니다. 신청 정보는 관리자만 확인합니다.</span></label><button class="primary" type="submit">이용 승인 요청</button></form><button id="open" class="primary" style="width:100%" hidden>이용하기</button><button id="refresh" class="quiet" style="width:100%;margin-top:12px" hidden>승인 상태 확인</button><p class="help">승인 권한은 이 브라우저에 저장됩니다. 기기 변경·브라우저 데이터 삭제 시 다시 신청해 주세요. 사번이 없는 외부인은 ‘외부’를 입력하고 소속을 이름 옆에 적어주세요.</p></section><a href="/" style="display:block;text-align:center;color:#315951">← ACTION HUB</a></main><script>
const $=id=>document.getElementById(id),resource=new URLSearchParams(location.search).get('resource')==='commission'?'commission':'library';let state='none';
async function load(){try{const r=await fetch('/api/access/status?resource='+resource,{cache:'no-store'});if(!r.ok)throw Error();const j=await r.json();state=j.status;$('label').textContent=j.label;$('requestForm').hidden=state!=='none';$('open').hidden=state!=='approved';$('refresh').hidden=state==='none'||state==='approved';$('message').textContent={none:'처음 한 번만 신청해 주세요. 관리자 확인 후 이용하실 수 있습니다.',pending:'신청이 접수됐습니다. 관리자 승인 대기 중입니다. 승인 후 이 화면에서 이용할 수 있습니다.',approved:'이 브라우저의 이용이 승인되었습니다.',rejected:'신청이 승인되지 않았습니다. 관리자에게 확인해 주세요.',revoked:'이용 권한이 중지되었습니다. 관리자에게 확인해 주세요.'}[state]}catch{$('message').textContent='승인 상태를 확인하지 못했습니다. 네트워크와 쿠키 설정을 확인해 주세요.';$('refresh').hidden=false}}
$('requestForm').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{const data=Object.fromEntries(new FormData(e.target));data.resource=resource;data.consent=e.target.elements.consent.checked;const r=await fetch('/api/access/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error();e.target.reset();await load()}catch{$('message').textContent='신청하지 못했습니다. 사번·이름·휴대폰번호와 동의를 확인해 주세요.'}finally{e.submitter.disabled=false}};
$('open').onclick=()=>location.href=resource==='commission'?'/commission/':'/?open=library';$('refresh').onclick=load;setInterval(()=>{if(state==='pending'&&document.visibilityState==='visible')load()},10000);load();
</script></body></html>
