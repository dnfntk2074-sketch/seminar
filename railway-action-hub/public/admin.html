<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACTION HUB 관리자</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#172033}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0001}input,select{width:100%;height:44px;border:1px solid #dbe1ea;border-radius:10px;padding:0 10px;margin:5px 0 10px}button{border:0;border-radius:10px;padding:11px 14px;font-weight:800}.primary{background:#2456d8;color:#fff}.danger{background:#e5484d;color:#fff}.ghost{background:#eef2f7}.row{display:flex;gap:8px;align-items:center}.item{border:1px solid #e5eaf1;border-radius:12px;padding:10px;margin-top:8px}.muted{color:#6b7280;font-size:12px}.hidden{display:none}.item.deleted{opacity:.55;background:#f3f4f6}</style></head><body><div class=wrap><h2>ACTION HUB 관리자</h2>
<div class=card id=login><b>관리자 로그인</b><input id=email type=email placeholder=이메일 value="dnfntk2074@gmail.com"><input id=pw type=password placeholder=비밀번호><button class=primary id=loginBtn>로그인</button><div class=muted id=loginMsg></div></div>
<div id=panel class=hidden><div class=card><div class=row><b style="flex:1">전광판 · 화면 설정</b><button class=ghost id=logout>로그아웃</button></div><label>전광판 모드</label><select id=mode><option value=auto>자동 (다음 방문 일정)</option><option value=manual>직접 입력</option></select><label>전광판 문구</label><input id=marquee><label>MVP 제목</label><input id=mvpTitle><label><input type=checkbox id=mvp style="width:auto;height:auto"> MVP 표시</label><label>앱 제목</label><input id=title><label>앱 부제목</label><input id=sub><label>로고 높이</label><input id=logo type=number min=20 max=70><button class=primary id=save>설정 저장</button></div>
<div class=card><b>최근 일정 관리</b><p class=muted>삭제는 이 앱에서 영구 제외됩니다. 실수 방지를 위해 한 번 더 확인합니다.</p><div id=list></div></div>
<div class=card><b>관리자 비밀번호 변경</b><input id=newpw type=password placeholder="새 비밀번호 (8자 이상)"><button class=primary id=change>비밀번호 변경</button><div class=muted id=changeMsg></div></div></div></div><script>
async function api(u,o={}){let r=await fetch(u,{...o,headers:{"content-type":"application/json",...(o.headers||{})}});if(r.status===401){showLogin();throw new Error("unauthorized")}return r}
function showLogin(){login.classList.remove("hidden");panel.classList.add("hidden")}
function showPanel(){login.classList.add("hidden");panel.classList.remove("hidden")}
loginBtn.onclick=async()=>{let r=await api("/api/admin/login",{method:"POST",body:JSON.stringify({email:email.value,password:pw.value})});if(r.ok){showPanel();load()}else loginMsg.textContent="로그인 정보를 확인해 주세요."}
logout.onclick=async()=>{await api("/api/admin/logout",{method:"POST"});showLogin()}
async function load(){let me=await fetch("/api/admin/me");if(!me.ok)return showLogin();showPanel();let s=await (await api("/api/admin/settings")).json();mode.value=s.marquee_mode;marquee.value=s.marquee_text||"";mvp.checked=s.mvp_enabled;mvpTitle.value=s.mvp_title;title.value=s.app_title;sub.value=s.app_subtitle;logo.value=s.logo_height;let j=await (await api("/api/admin/schedules")).json();list.innerHTML="";(j.schedules||[]).slice().reverse().slice(0,80).forEach(x=>{let d=document.createElement("div");d.className="item"+(x.deleted?" deleted":"");d.innerHTML=`<b>${x.ownerName||""}</b><div class=muted>${new Date(x.scheduledAt).toLocaleString("ko-KR")} · ${x.customerName||""}</div>`;let b=document.createElement("button");b.className=x.deleted?"ghost":"danger";b.textContent=x.deleted?"복구":"완전 삭제";b.onclick=async()=>{if(!x.deleted&&!confirm("정말 삭제할까요? 공개 화면에서 즉시 사라지고 관리자에서만 복구할 수 있습니다."))return;await api("/api/admin/schedules/"+encodeURIComponent(x.id)+(x.deleted?"/restore":""),{method:x.deleted?"POST":"DELETE"});load()};d.appendChild(b);list.appendChild(d)})}
save.onclick=async()=>{await api("/api/admin/settings",{method:"PUT",body:JSON.stringify({marquee_mode:mode.value,marquee_text:marquee.value,mvp_enabled:mvp.checked,mvp_title:mvpTitle.value,app_title:title.value,app_subtitle:sub.value,logo_height:Number(logo.value)})});alert("저장되었습니다.")}
change.onclick=async()=>{let r=await api("/api/admin/change-password",{method:"POST",body:JSON.stringify({password:newpw.value})});changeMsg.textContent=r.ok?"비밀번호가 변경되었습니다.":"8자 이상으로 설정해 주세요.";if(r.ok)newpw.value=""}
load();
</script></body></html>
