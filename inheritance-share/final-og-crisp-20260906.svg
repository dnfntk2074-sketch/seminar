 <rect x="350" y="488" width="145" height="46" rx="23" fill="#e9f7f8"/><circle cx="374" cy="511" r="12" fill="#00a5ad"/><text x="394" y="518" class="navy sb" font-size="17">세율·공제 반영</text>
