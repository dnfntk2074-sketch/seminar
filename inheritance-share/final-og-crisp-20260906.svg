 <rect x="38" y="488" width="145" height="46" rx="23" fill="#e9f7f8"/><circle cx="62" cy="511" r="12" fill="#00a5ad"/><text x="82" y="518" class="navy sb" font-size="17">총 상속자산 입력</text>
