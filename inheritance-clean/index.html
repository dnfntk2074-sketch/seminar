<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>예상 상속세금 계산기</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f8fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="/inheritance-tax/" title="예상 상속세금 계산기"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{try{const d=f.contentDocument;[...d.querySelectorAll('section.card')].forEach(s=>{if(s.textContent.includes('홈 화면 사용 안내')||s.textContent.includes('앱처럼 꺼내놓고 사용하세요'))s.remove()});}catch(e){}});</script></body></html>
