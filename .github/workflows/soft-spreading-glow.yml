name: Apply soft spreading glow
on:
  push:
    paths:
      - '.github/workflows/soft-spreading-glow.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace shimmer with spreading light
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('goldenCtaGlow 3s 1.35s ease-in-out infinite','goldenCtaGlow 5.4s 1.35s ease-in-out infinite')
          s=s.replace('.golden-cta:after{left:-25%;animation:goldenCtaSheen 3s 1.35s ease-in-out infinite}', '.golden-cta:after{left:50%;top:50%;width:12%;height:12%;border-radius:999px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,225,154,.34) 0%,rgba(211,168,83,.18) 38%,rgba(211,168,83,0) 72%);filter:blur(2px);animation:goldenCtaSheen 5.4s 1.35s ease-in-out infinite}')
          s=s.replace('goldenArrowNudge 3s 1.35s ease-in-out infinite','goldenArrowNudge 5.4s 1.35s ease-in-out infinite')
          s=s.replace('.golden-cta:hover:after{animation:none;left:110%}', '.golden-cta:hover:after{animation:goldenCtaSheen 5.4s ease-in-out infinite}')
          old='@keyframes goldenCtaSheen{\n  0%,70%{left:-25%;opacity:0}\n  74%{opacity:.75}\n  88%{left:112%;opacity:.2}\n  100%{left:112%;opacity:0}\n}'
          new='@keyframes goldenCtaSheen{\n  0%,58%,100%{opacity:0;transform:translate(-50%,-50%) scale(.35)}\n  66%{opacity:.28}\n  82%{opacity:.72;transform:translate(-50%,-50%) scale(8.5)}\n  94%{opacity:0;transform:translate(-50%,-50%) scale(13)}\n}'
          if old not in s: raise SystemExit('target keyframes not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit result
        run: |
          git config user.name chatgpt-update
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m 'Change shimmer to slow spreading glow'
          git push
