name: Fix inheritance OG
on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-inheritance-og.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point OG tags to fresh image URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('inheritance-tax/index.html')
          s=p.read_text()
          old='https://seminar202609.vercel.app/inheritance-tax/inheritance-og-kakao-v15.jpg?v=20260905-1830'
          new='https://seminar202609.vercel.app/inheritance-tax/kakao-thumb-20260905-1845.jpg'
          if old not in s:
              raise SystemExit('old OG URL not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inheritance-tax/index.html
          git commit -m 'Fix inheritance Kakao thumbnail URL'
          git push
