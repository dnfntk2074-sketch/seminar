name: Switch inheritance thumbnail raw
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  switch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch OG image URL to public raw image
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('inheritance-tax/index.html')
          s=p.read_text()
          old='https://seminar202609.vercel.app/api/inheritance-thumb?v=20260905-1921'
          new='https://raw.githubusercontent.com/dnfntk2074-sketch/seminar/main/inheritance-tax/inheritance-og-kakao-v15.jpg?v=20260905-1928'
          if old in s:
              p.write_text(s.replace(old,new))
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inheritance-tax/index.html
          git diff --cached --quiet || git commit -m 'Use public raw image for inheritance OG'
          git push
