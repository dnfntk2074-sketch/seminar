name: Switch inheritance thumbnail weserv
on:
  push:
    paths:
      - '.github/trigger-inheritance-weserv.txt'
permissions:
  contents: write
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch OG image URL to weserv
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('inheritance-tax/index.html')
          s=p.read_text()
          import re
          new='https://images.weserv.nl/?url=cdn.jsdelivr.net/gh/dnfntk2074-sketch/seminar@main/inheritance-tax/inheritance-og-kakao-v15.jpg&output=jpg&w=1200&h=630&fit=cover&v=20260905-1935'
          s=re.sub(r'https://cdn\.jsdelivr\.net/gh/dnfntk2074-sketch/seminar@main/inheritance-tax/inheritance-og-kakao-v15\.jpg(?:\?[^\"<]*)?',new,s)
          s=re.sub(r'https://raw\.githubusercontent\.com/dnfntk2074-sketch/seminar/main/inheritance-tax/inheritance-og-kakao-v15\.jpg(?:\?[^\"<]*)?',new,s)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inheritance-tax/index.html
          git commit -m 'Use weserv CDN for inheritance OG image' || exit 0
          git push
