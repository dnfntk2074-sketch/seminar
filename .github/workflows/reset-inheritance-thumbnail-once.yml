name: Reset inheritance thumbnail once
on:
  push:
    paths:
      - '.github/trigger-reset-inheritance-thumbnail-once.txt'
permissions:
  contents: write
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reset OG metadata to one same-origin JPEG
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('inheritance-tax/index.html')
          s=p.read_text()
          img='https://seminar202609.vercel.app/inheritance-tax/social-card-20260905.jpg'
          s=re.sub(r'<meta property="og:image" content="[^"]*">', f'<meta property="og:image" content="{img}">', s)
          s=re.sub(r'<meta property="og:image:secure_url" content="[^"]*">', f'<meta property="og:image:secure_url" content="{img}">', s)
          s=re.sub(r'<meta name="twitter:image" content="[^"]*">', f'<meta name="twitter:image" content="{img}">', s)
          s=re.sub(r'<meta property="og:image:width" content="[^"]*">', '<meta property="og:image:width" content="600">', s)
          s=re.sub(r'<meta property="og:image:height" content="[^"]*">', '<meta property="og:image:height" content="315">', s)
          p.write_text(s)
          PY
      - name: Commit reset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inheritance-tax/index.html
          git commit -m 'Reset inheritance thumbnail to same-origin JPEG'
          git push
