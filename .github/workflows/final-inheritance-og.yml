name: Final inheritance OG fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force stable OG image URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('inheritance-tax/index.html')
          s=p.read_text()
          old='https://cdn.jsdelivr.net/gh/dnfntk2074-sketch/seminar@0d5e9150259624e85734e18b7b08f69852db885f/inheritance-tax/inheritance-og-kakao-v15.jpg'
          new='https://images.weserv.nl/?url=cdn.jsdelivr.net/gh/dnfntk2074-sketch/seminar@0d5e9150259624e85734e18b7b08f69852db885f/inheritance-tax/inheritance-og-kakao-v15.jpg&output=jpg&w=1200&h=630&fit=cover&v=20260905-1945'
          if old not in s:
              raise SystemExit('expected OG URL not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit final fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inheritance-tax/index.html
          git commit -m 'Final Kakao OG image fix'
          git push
