<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#342067"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="상속세 계산기"><title>예상 상속세금 계산기</title><meta name="description" content="상속재산 규모와 가족 구성을 입력하면 예상 상속세를 간편하게 비교할 수 있습니다."><link rel="canonical" href="https://seminar202609.vercel.app/inheritance-tax/?v=20260905-10"><link rel="manifest" href="https://raw.githubusercontent.com/dnfntk2074-sketch/seminar/main/inheritance-tax/manifest.webmanifest?v=20260905-10"><link rel="apple-touch-icon" href="https://images.weserv.nl/?url=raw.githubusercontent.com/dnfntk2074-sketch/seminar/main/inheritance-tax/icon.svg&output=png&w=180&h=180&fit=cover&v=20260905-10"><meta property="og:type" content="website"><meta property="og:url" content="https://seminar202609.vercel.app/inheritance-tax/?v=20260905-10"><meta property="og:site_name" content="상속세 계산기"><meta property="og:title" content="예상 상속세금 계산기"><meta property="og:description" content="상속재산과 가족 구성을 입력하면 예상 상속세를 한눈에 비교합니다."><meta property="og:image" content="https://raw.githubusercontent.com/dnfntk2074-sketch/seminar/main/inheritance-tax/inheritance-og-korean-v10.jpg"><meta property="og:image:secure_url" content="https://raw.githubusercontent.com/dnfntk2074-sketch/seminar/main/inheritance-tax/inheritance-og-korean-v10.jpg"><meta property="og:image:type" content="image/jpeg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="예상 상속세금 계산기"><meta name="twitter:description" content="상속재산과 가족 구성을 입력하면 예상 상속세를 한눈에 비교합니다."><meta name="twitter:image" content="https://raw.githubusercontent.com/dnfntk2074-sketch/seminar/main/inheritance-tax/inheritance-og-korean-v10.jpg"><style>:root{--n:#17233f;--p:#6847d9;--bg:#f4f2fb;--line:#e6e2f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#20243a}.wrap{max-width:1060px;margin:auto;padding:18px}.hero{padding:30px;border-radius:26px;color:#fff;background:linear-gradient(135deg,#17233f,#3a2b75 62%,#6847d9);box-shadow:0 16px 44px #2b245c2e}.hero small{font-weight:800;letter-spacing:.08em;opacity:.75}.hero h1{font-size:40px;margin:9px 0}.hero p{margin:0;opacity:.9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 26px #1f1a4e12}.label{font-size:14px;font-weight:800;margin:15px 0 8px}.money{display:flex;align-items:center;border:2px solid #dad5ef;border-radius:15px;padding:2px 12px;background:#fbfaff}.money input{border:0;outline:0;background:transparent;width:100%;padding:12px 0;text-align:right;font-size:25px;font-weight:900}.chips,.seg,.children{display:flex;gap:8px;flex-wrap:wrap}.chips button,.seg button,.children button{border:1px solid #ddd8ec;background:#fff;padding:10px 12px;border-radius:12px;font-weight:800}.active{background:#5f43cc!important;color:#fff;border-color:#5f43cc!important}.big{background:linear-gradient(135deg,#f2edff,#fff);border:1px solid #e1d8ff;border-radius:18px;padding:20px}.tax{font-size:40px;font-weight:900;color:#4c31b3;margin-top:6px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.row span:last-child{font-weight:850}.note{font-size:12px;line-height:1.6;color:#777;margin-top:14px}.tablecard{margin-top:18px}.tablewrap{overflow:auto}.table{border-collapse:collapse;width:100%;min-width:880px;font-size:13px}.table th{background:#524177;color:white;padding:12px}.table td{padding:11px;border-bottom:1px solid #ece9f3;text-align:right}.table td:first-child{text-align:center;font-weight:850}@media(max-width:760px){.wrap{padding:11px}.grid{grid-template-columns:1fr}.hero h1{font-size:30px}.tax{font-size:34px}}</style></head><body><div class="wrap"><section class="hero"><small>INHERITANCE TAX SIMULATOR</small><h1>예상 상속세금 계산기</h1><p>상속재산 규모와 가족 구성을 선택하면 예상 상속세를 빠르게 비교합니다.</p></section><section class="grid"><div class="card"><h2>고객님의 상속 조건</h2><div class="label">상속재산가액</div><div class="money"><input id="asset" inputmode="decimal" value="30"><b>억원</b></div><div class="chips" id="assetChips" style="margin-top:10px"><button data-v="5">5억</button><button data-v="10">10억</button><button data-v="15">15억</button><button data-v="20">20억</button><button data-v="30" class="active">30억</button><button data-v="50">50억</button></div><div class="label">배우자</div><div class="seg" id="spouse"><button data-v="1" class="active">배우자 있음</button><button data-v="0">배우자 없음</button></div><div class="label">자녀 수</div><div class="children" id="children"><button data-v="0">없음</button><button data-v="1" class="active">1명</button><button data-v="2">2명</button><button data-v="3">3명+</button></div><div class="note">교육·상담용 단순 시뮬레이션입니다. 실제 세액은 사전증여, 금융재산, 채무·공과금, 장례비, 배우자 실제 상속액 및 기타 공제 등에 따라 달라질 수 있습니다.</div></div><div class="card"><h2>예상 상속세</h2><div class="big"><small id="summary"></small><div class="tax" id="tax"></div><div id="headline"></div></div><div class="row"><span>상속재산가액</span><span id="rAsset"></span></div><div class="row"><span>적용 공제액</span><span id="rDed"></span></div><div class="row"><span>과세표준</span><span id="rBase"></span></div><div class="row"><span>산출세액</span><span id="rGross"></span></div><div class="row"><span>신고세액공제 3%</span><span id="rCredit"></span></div></div></section><section class="card tablecard"><h2>가족 구성별 예상 상속세 비교</h2><div class="tablewrap"><table class="table" id="compare"></table></div></section></div><script>let spouse=1,kids=1;const asset=document.getElementById('asset');const fmt=w=>{w=Math.max(0,Math.round(w/10000)*10000);if(!w)return'0원';let e=Math.floor(w/1e8),m=Math.round(w%1e8/1e4);return(e?e+'억 ':'')+(m?m.toLocaleString()+'만원':'').trim()};function grossTax(base){let x=base/1e8;if(x<=0)return 0;let t=x<=1?x*.1:x<=5?x*.2-.1:x<=10?x*.3-.6:x<=30?x*.4-1.6:x*.5-4.6;return t*1e8}function deduction(a,s,k){if(!s)return 5;let share=k===0?1:k===1?.6:k===2?3/7:1/3;let sd=Math.min(30,Math.max(5,a*share));return Math.max(5,Math.min(a,5+sd))}function calc(a,s,k){let d=deduction(a,s,k),b=Math.max(0,a-d),g=grossTax(b*1e8);return{ded:d,base:b,gross:g,tax:Math.max(0,g*.97),credit:g*.03}}function render(){let a=Math.max(0,parseFloat(asset.value)||0),c=calc(a,spouse,kids);summary.textContent=(spouse?'배우자'+(kids?' + 자녀 '+kids+(kids>=3?'명 이상':'명'):'만'):'배우자 없음')+' · 상속재산 '+a+'억원';tax.textContent=fmt(c.tax);rAsset.textContent=a+'억원';rDed.textContent=(Math.round(c.ded*100)/100)+'억원';rBase.textContent=(Math.round(c.base*100)/100)+'억원';rGross.textContent=fmt(c.gross);rCredit.textContent='-'+fmt(c.credit);let alt=calc(a,spouse?0:1,kids);headline.textContent='배우자 유무 단순 비교 차이 약 '+fmt(Math.abs(c.tax-alt.tax));renderTable()}function renderTable(){const amounts=[5,7,10,12,15,20,25,30,35,40,45,50],cols=[['배우자만',1,0],['배우자+자녀1',1,1],['배우자+자녀2',1,2],['배우자+자녀3',1,3],['배우자없음 자녀1',0,1],['배우자없음 자녀2',0,2],['배우자없음 자녀3',0,3]];let h='<tr><th>상속재산</th>'+cols.map(x=>'<th>'+x[0]+'</th>').join('')+'</tr>';amounts.forEach(a=>h+='<tr><td>'+a+'억원</td>'+cols.map(x=>'<td>'+fmt(calc(a,x[1],x[2]).tax)+'</td>').join('')+'</tr>');compare.innerHTML=h}assetChips.onclick=e=>{if(!e.target.dataset.v)return;asset.value=e.target.dataset.v;[...assetChips.children].forEach(x=>x.classList.toggle('active',x===e.target));render()};const spouseEl=document.getElementById('spouse');spouseEl.onclick=e=>{if(e.target.dataset.v===undefined)return;spouse=+e.target.dataset.v;[...spouseEl.children].forEach(x=>x.classList.toggle('active',x===e.target));render()};const childrenEl=document.getElementById('children');childrenEl.onclick=e=>{if(e.target.dataset.v===undefined)return;kids=+e.target.dataset.v;[...childrenEl.children].forEach(x=>x.classList.toggle('active',x===e.target));render()};asset.oninput=render;render();</script></body></html>
